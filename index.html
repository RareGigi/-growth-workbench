<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef1fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="app.css?v=clean-1"><title>小小生长册</title></head><body><div id="app"></div><script>if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}if('caches'in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)));}</script><script src="app.js?v=clean-1"></script></body></html>
