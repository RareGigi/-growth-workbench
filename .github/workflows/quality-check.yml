name: Quality Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
          node --check focus-immersive.js
          node --check focus-room-experience.js
          node --check scripts/validate-static.mjs

      - name: Validate local assets and focus presets
        run: node scripts/validate-static.mjs
